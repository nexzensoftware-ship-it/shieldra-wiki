<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shieldra — Landing UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="icon" href="../../assets/favicon/favicon-32.svg">
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#fff; font-family:var(--font-sans); color:#0f172a; -webkit-font-smoothing:antialiased; }
    body { overflow-x:hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="MeshBackground.jsx"></script>
  <script type="text/babel" src="FloatingStatCard.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="FeatureCard.jsx"></script>
  <script type="text/babel">
    function App() {
      return (
        <div data-screen-label="Landing">
          <Navbar/>
          <Hero/>
          <FeatureSection/>
          <footer style={{ maxWidth:1280, margin:'0 auto', padding:'60px 24px 40px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center', color:'#64748b', fontSize:13 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <img src="../../assets/logo/icon-primary.svg" style={{ width:24, height:24, borderRadius:6 }}/>
              <span style={{ fontWeight:600, color:'#0f172a' }}>Shieldra</span>
              <span>© 2026 Nexzen Software</span>
            </div>
            <div style={{ display:'flex', gap:20 }}>
              <a href="#" style={{ color:'#64748b', textDecoration:'none' }}>Privacy</a>
              <a href="#" style={{ color:'#64748b', textDecoration:'none' }}>Terms</a>
              <a href="#" style={{ color:'#64748b', textDecoration:'none' }}>Security</a>
            </div>
          </footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
