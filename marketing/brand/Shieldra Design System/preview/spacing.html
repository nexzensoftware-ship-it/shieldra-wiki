<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--surface-500)}
.row{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.t{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--surface-500);font-family:var(--font-mono)}
.t .b{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:6px;width:28px}
.t b{color:var(--surface-900);font-family:var(--font-sans);font-weight:700;font-size:11px}
</style></head><body>
<p class="eyebrow">Spacing scale (rem · Tailwind)</p>
<div class="row">
 <div class="t"><div class="b" style="height:4px"></div><b>1</b>4px</div>
 <div class="t"><div class="b" style="height:8px"></div><b>2</b>8</div>
 <div class="t"><div class="b" style="height:12px"></div><b>3</b>12</div>
 <div class="t"><div class="b" style="height:16px"></div><b>4</b>16</div>
 <div class="t"><div class="b" style="height:20px"></div><b>5</b>20</div>
 <div class="t"><div class="b" style="height:24px"></div><b>6</b>24</div>
 <div class="t"><div class="b" style="height:32px"></div><b>8</b>32</div>
 <div class="t"><div class="b" style="height:40px"></div><b>10</b>40</div>
 <div class="t"><div class="b" style="height:48px"></div><b>12</b>48</div>
 <div class="t"><div class="b" style="height:64px"></div><b>16</b>64</div>
 <div class="t"><div class="b" style="height:80px"></div><b>20</b>80</div>
 <div class="t"><div class="b" style="height:96px"></div><b>24</b>96</div>
</div>
</body></html>
