<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--surface-500)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--surface-500);font-family:var(--font-mono)}
.ic svg{stroke:var(--surface-700)}
</style>
<script src="https://unpkg.com/lucide@latest"></script>
</head><body>
<p class="eyebrow">Iconography — Lucide (primary system)</p>
<div class="grid" id="g"></div>
<script>
const names=['shield','shield-check','shield-alert','sparkles','activity','bell','bot','brain','building-2','file-text','layout-dashboard','list-checks','map','network','plug','radio','server','settings','target','wrench','zap','book-open','library','globe','chevron-down','trending-up','check-circle-2','alert-triangle','clipboard-list','play','graduation-cap','user-check'];
const g=document.getElementById('g');
names.forEach(n=>{
  g.innerHTML+=`<div class="ic"><i data-lucide="${n}" style="width:22px;height:22px"></i>${n}</div>`;
});
window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());
lucide.createIcons();
</script>
</body></html>
