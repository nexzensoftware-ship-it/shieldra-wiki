<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--surface-500)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--surface-700);margin-bottom:6px}
.inp{width:100%;height:40px;border:1px solid var(--surface-200);border-radius:8px;padding:0 12px;font:inherit;background:#fff;box-sizing:border-box;color:var(--surface-900);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.inp.err{border-color:#ef4444}
.hint{font-size:12px;color:var(--surface-500);margin-top:4px}
.err-t{font-size:12px;color:#dc2626;margin-top:4px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--surface-700);margin-top:10px}
.sw{width:34px;height:20px;border-radius:99px;background:#2563eb;position:relative;transition:.2s}
.sw::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:17px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
</style></head><body>
<p class="eyebrow">Form inputs</p>
<div class="row">
 <div class="field"><label>Organization email</label><input class="inp" value="admin@compliancevision.ai"><div class="hint">Used for audit log attribution.</div></div>
 <div class="field"><label>API key</label><input class="inp err" value="sk_live_••••••"><div class="err-t">Invalid or expired key.</div></div>
</div>
<div class="tog"><span class="sw"></span>Enable continuous monitoring</div>
</body></html>
