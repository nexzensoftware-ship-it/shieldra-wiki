<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);color:var(--surface-900)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--surface-500)}
.row{display:grid;gap:12px}
.spec{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--surface-100);padding-bottom:10px}
.spec:last-child{border-bottom:none}
.meta{width:150px;font-family:var(--font-mono);font-size:11px;color:var(--surface-500);flex-shrink:0}
.sample{line-height:1.1;letter-spacing:-.02em}
</style></head><body>
<p class="eyebrow">Type scale — Display</p>
<div class="row">
 <div class="spec"><div class="meta">6xl · 800 · -2%</div><div class="sample" style="font-size:60px;font-weight:800">Shields your business.</div></div>
 <div class="spec"><div class="meta">5xl · 800 · -2%</div><div class="sample" style="font-size:48px;font-weight:800">Regulatory AI, unified.</div></div>
 <div class="spec"><div class="meta">4xl · 700 · -2%</div><div class="sample" style="font-size:36px;font-weight:700">Continuous compliance</div></div>
</div>
</body></html>
