<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-family:var(--font-sans);min-height:calc(100vh - 48px)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#475569}
.glass{background:rgba(255,255,255,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:20px;box-shadow:0 16px 64px rgba(0,0,0,.10);position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.1),transparent,rgba(139,92,246,.1));pointer-events:none}
.rel{position:relative}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tile{width:28px;height:28px;border-radius:8px;background:#cffafe;color:#0891b2;display:flex;align-items:center;justify-content:center}
.ring{display:flex;align-items:center;justify-content:center;margin:6px 0}
.num{font-size:30px;font-weight:800;color:#0f172a}
.unit{font-size:15px;color:#06b6d4;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head><body>
<p class="eyebrow">Glass cards (floating over hero)</p>
<div class="row">
 <div class="glass"><div class="rel">
  <div class="lbl"><div class="tile">◈</div>Compliance Score</div>
  <div class="ring">
   <svg width="90" height="90" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#f1f5f9" stroke-width="8"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="258 264"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs>
   </svg>
   <div style="position:absolute;display:flex;align-items:center;justify-content:center;width:90px;height:90px;margin-top:-90px"><span class="num">98<span class="unit">%</span></span></div>
  </div>
 </div></div>
 <div class="glass"><div class="rel">
  <div class="lbl"><div class="tile" style="background:#ede9fe;color:#7c3aed">▲</div>HIPAA Readiness</div>
  <div class="num" style="margin-top:6px">99.2<span class="unit">%</span></div>
  <div style="background:#f1f5f9;height:8px;border-radius:99px;margin-top:8px;overflow:hidden"><div style="width:99%;height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#06b6d4);border-radius:99px"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:#94a3b8;font-weight:500"><span>Administrative</span><span>Physical</span><span>Technical</span></div>
 </div></div>
</div>
</body></html>
