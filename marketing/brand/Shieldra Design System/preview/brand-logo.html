<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-family:var(--font-sans)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#475569}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{width:72px;height:72px;border-radius:16px;box-shadow:0 0 20px rgba(59,130,246,.15)}
.lockup{display:flex;align-items:center;gap:10px;background:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow-sm)}
.lockup .n{font-weight:700;color:#0f172a;font-size:18px}
.lockup .ai{display:inline-flex;align-items:center;padding:2px 6px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;font-size:10px;font-weight:700;border-radius:4px;letter-spacing:.1em}
</style></head><body>
<p class="eyebrow">Logo & lockup</p>
<div class="row">
 <img class="logo" src="../assets/logo/icon-primary.svg" alt="Shieldra">
 <img class="logo" src="../assets/logo/icon-monochrome-white.svg" alt="Shieldra mono" style="background:#0f172a">
 <img class="logo" src="../assets/logo/icon-light-bg.svg" alt="Shieldra light">
 <div class="lockup">
  <img src="../assets/logo/icon-primary.svg" style="width:32px;height:32px;border-radius:8px">
  <span class="n">Shieldra</span>
  <span class="ai">AI ✦</span>
 </div>
</div>
</body></html>
