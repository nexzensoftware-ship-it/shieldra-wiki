<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--surface-500)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fam{border:1px solid var(--surface-200);border-radius:12px;padding:18px}
.name{font-size:13px;font-weight:600;color:var(--surface-500);margin-bottom:10px}
.big{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--surface-900)}
.med{font-size:16px;margin-top:10px;color:var(--surface-700)}
.usage{font-size:11px;color:var(--surface-500);margin-top:14px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sans{font-family:'Inter',system-ui,sans-serif}
</style></head><body>
<p class="eyebrow">Type families</p>
<div class="row">
 <div class="fam sans">
  <div class="name">Inter — sans</div>
  <div class="big">Shieldra AI</div>
  <div class="med">The regulatory AI that shields your business.</div>
  <div class="usage">Weights 300–900 · UI, headings, body · OpenType cv02, cv03, cv04, cv11</div>
 </div>
 <div class="fam">
  <div class="name sans">JetBrains Mono — mono</div>
  <div class="big mono">99.2%</div>
  <div class="med mono">GET /api/v1/compliance</div>
  <div class="usage sans">Weights 400/500/600 · Code, numbers, API paths</div>
 </div>
</div>
</body></html>
