<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif">
  <!-- ============ defs ============ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ctaGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="iconShield" viewBox="0 0 24 24">
      <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="m8.5 12 2.5 2.5L15.5 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="iconBrain" viewBox="0 0 24 24">
      <path d="M9 5a3 3 0 0 0-3 3v0a3 3 0 0 0-2 5.3A3 3 0 0 0 6 18a3 3 0 0 0 3 3V5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M15 5a3 3 0 0 1 3 3v0a3 3 0 0 1 2 5.3A3 3 0 0 1 18 18a3 3 0 0 1-3 3V5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M9 9h1M14 9h1M9 13h1M14 13h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="iconGraduation" viewBox="0 0 24 24">
      <path d="M2 9 12 4l10 5-10 5L2 9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M6 11v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M22 9v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="iconLayers" viewBox="0 0 24 24">
      <path d="M12 3 3 7.5l9 4.5 9-4.5L12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M3 12l9 4.5L21 12M3 16.5 12 21l9-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="iconAlert" viewBox="0 0 24 24">
      <path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="iconNetwork" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="5" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="19" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 7.5 5.8 17M12 7.5 18.2 17M7.5 19h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- ============ background ============ -->
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="650" ry="320" fill="url(#heroGlow)"/>
  <!-- faint grid texture -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <path d="M0 200h1200M0 400h1200M0 600h1200M0 800h1200M0 1000h1200M0 1200h1200"/>
    <path d="M200 0v1500M400 0v1500M600 0v1500M800 0v1500M1000 0v1500"/>
  </g>

  <!-- ============ top brand bar ============ -->
  <g transform="translate(60,60)">
    <!-- brand mark -->
    <g transform="translate(0,0)" filter="url(#cyanGlow)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#0b1220" stroke="url(#accentCyan)" stroke-width="1.5"/>
      <use href="#iconShield" x="10" y="10" width="36" height="36" color="#22d3ee"/>
    </g>
    <text x="74" y="27" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.5">SHIELDRA AI</text>
    <text x="74" y="50" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="2">COMPLIANCE · AUTOMATED</text>

    <!-- url pill on right -->
    <g transform="translate(860,4)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#0b1220" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="24" r="4" fill="#22d3ee"/>
      <text x="40" y="29" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">www.shieldra.ai</text>
    </g>
  </g>

  <!-- ============ hero headline ============ -->
  <g transform="translate(60,180)">
    <text x="0" y="0" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">AI-Powered Compliance</text>
    <text x="0" y="80" font-size="68" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#ffffff">for </tspan><tspan fill="url(#accentCyan)">Modern Healthcare</tspan>
    </text>
    <text x="0" y="140" font-size="24" font-weight="500" fill="#cbd5e1">
      HIPAA · HITRUST · SOC 2 · ISO 27001 · NIST — one platform, every control.
    </text>
  </g>

  <!-- ============ coming-soon banner ============ -->
  <g transform="translate(60,380)">
    <rect x="0" y="0" width="1080" height="72" rx="36" fill="#0b1220" stroke="url(#accentOrange)" stroke-width="1.5"/>
    <circle cx="48" cy="36" r="8" fill="#f97316">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="78" y="30" font-size="14" font-weight="700" fill="#fb923c" letter-spacing="3">COMING SOON</text>
    <text x="78" y="56" font-size="22" font-weight="700" fill="#ffffff">Public Launch — Spring 2026</text>
    <text x="1044" y="44" text-anchor="end" font-size="15" font-weight="600" fill="#94a3b8">Join the early-access list →</text>
  </g>

  <!-- ============ feature grid (2 cols × 3 rows) ============ -->
  <!-- card template: 525 × 210, radius 20, bg #111b2f, stroke #1f2a44 -->
  <!-- row 1 -->
  <g transform="translate(60,490)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#22d3ee">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconBrain" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Compliance Agents</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="1.5">AUTONOMOUS · ALWAYS-ON</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">AI agents scan policies, remediate gaps,</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">and draft evidence — while your team sleeps.</text>
  </g>
  <g transform="translate(615,490)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#22d3ee">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconGraduation" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Private Learning Engine</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="1.5">GETS SMARTER · STAYS YOURS</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">RAG + feedback loop learns from every</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">correction. Tenant-isolated. Zero leakage.</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(60,720)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#fb923c">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#fb923c" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconLayers" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Every Framework, One Map</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#fb923c" letter-spacing="1.5">73 HIPAA REQS · MULTI-STANDARD</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">Control crosswalks across HIPAA, SOC 2,</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">HITRUST, ISO 27001, NIST — write once.</text>
  </g>
  <g transform="translate(615,720)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#fb923c">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#fb923c" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconShield" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Vendors, BAAs &amp; Evidence</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#fb923c" letter-spacing="1.5">PHI-AWARE · AUDIT-READY</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">Track BAAs, PHI access, vendor risk, and</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">evidence lineage in one sealed audit trail.</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(60,950)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#22d3ee">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconAlert" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Incident Response</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="1.5">§164.408 TIMELINES · AUTOMATED</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">Breach notification clocks run automatically</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">— HHS, media, patients — never miss a day.</text>
  </g>
  <g transform="translate(615,950)">
    <rect width="525" height="210" rx="20" fill="#111b2f" stroke="#1f2a44" stroke-width="1"/>
    <g transform="translate(30,28)" color="#fb923c">
      <rect width="56" height="56" rx="14" fill="#0b1220" stroke="#fb923c" stroke-width="1.2" opacity="0.9"/>
      <use href="#iconNetwork" x="12" y="12" width="32" height="32"/>
    </g>
    <text x="104" y="54" font-size="24" font-weight="700" fill="#ffffff">Enterprise, Multi-Tenant</text>
    <text x="104" y="82" font-size="15" font-weight="500" fill="#fb923c" letter-spacing="1.5">SSO · RBAC · ZERO CROSS-LEAK</text>
    <text x="30" y="140" font-size="17" fill="#cbd5e1">Built for the whole healthcare stack —</text>
    <text x="30" y="164" font-size="17" fill="#cbd5e1">from solo practice to hospital network.</text>
  </g>

  <!-- ============ metrics strip ============ -->
  <g transform="translate(60,1200)">
    <rect width="1080" height="110" rx="20" fill="#0b1220" stroke="#1f2a44"/>
    <g font-family="inherit">
      <text x="130" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="url(#accentCyan)">73</text>
      <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">HIPAA REQUIREMENTS</text>

      <line x1="260" y1="25" x2="260" y2="85" stroke="#1f2a44"/>

      <text x="390" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="url(#accentCyan)">5</text>
      <text x="390" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">COMPLIANCE FRAMEWORKS</text>

      <line x1="520" y1="25" x2="520" y2="85" stroke="#1f2a44"/>

      <text x="650" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="url(#accentOrange)">24/7</text>
      <text x="650" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">CONTINUOUS MONITORING</text>

      <line x1="790" y1="25" x2="790" y2="85" stroke="#1f2a44"/>

      <text x="930" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="url(#accentOrange)">0</text>
      <text x="930" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">CROSS-TENANT LEAKS</text>
    </g>
  </g>

  <!-- ============ CTA footer ============ -->
  <g transform="translate(0,1350)">
    <ellipse cx="600" cy="80" rx="500" ry="100" fill="url(#ctaGlow)"/>
    <text x="600" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#fb923c" letter-spacing="3">BE FIRST IN LINE</text>
    <text x="600" y="100" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">
      Early access is open now →
      <tspan fill="#22d3ee"> www.shieldra.ai</tspan>
    </text>
  </g>
</svg>
