<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shieldra — Business Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --brand-400:#60a5fa; --brand-500:#3b82f6; --brand-600:#2563eb; --brand-700:#1d4ed8; --brand-900:#1e3a8a;
    --accent-300:#67e8f9; --accent-400:#22d3ee; --accent-500:#06b6d4; --accent-600:#0891b2;
    --violet-400:#a78bfa; --violet-500:#8b5cf6; --violet-600:#7c3aed;
    --surface-0:#ffffff; --surface-50:#f8fafc; --surface-100:#f1f5f9; --surface-200:#e2e8f0;
    --surface-300:#cbd5e1; --surface-400:#94a3b8; --surface-500:#64748b; --surface-600:#475569;
    --surface-700:#334155; --surface-800:#1e293b; --surface-900:#0f172a; --surface-950:#020617;
    --ink:#0C1222;
  }
  html, body { margin:0; padding:0; height:100%; background:#0a0e1a; font-family:'Inter', system-ui, sans-serif; color:#e2e8f0; }
  body { font-feature-settings: "cv02","cv03","cv04","cv11","rlig","calt"; }

  /* ───── Card base — standard 3.5" × 2" at 200 DPI ≈ 700×400 ───── */
  .card {
    width: 700px;
    height: 400px;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
    isolation: isolate;
  }
  .card .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 9.5px;
    font-weight: 600;
  }

  /* ─────────────────────────────────────────────────────
     CONCEPT 1 — "Network" : the network-of-nodes graph as canvas
     ───────────────────────────────────────────────────── */
  .c1-front {
    background:
      radial-gradient(120% 80% at 100% 0%, rgba(34,211,238,0.18) 0%, transparent 55%),
      radial-gradient(120% 100% at 0% 100%, rgba(124,58,237,0.18) 0%, transparent 55%),
      linear-gradient(180deg, #0C1222 0%, #162032 100%);
    color:#e2e8f0;
  }
  .c1-front .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(140% 90% at 70% 50%, #000 0%, transparent 75%);
  }
  .c1-front .glow-tl {
    position:absolute; top:-120px; left:-120px; width:340px; height:340px;
    background: radial-gradient(closest-side, rgba(59,130,246,0.55), transparent 70%);
    filter: blur(20px);
  }
  .c1-front .glow-br {
    position:absolute; bottom:-160px; right:-100px; width:380px; height:380px;
    background: radial-gradient(closest-side, rgba(34,211,238,0.45), transparent 70%);
    filter: blur(24px);
  }
  .c1-front .net {
    position:absolute; right:-30px; top:50%; transform:translateY(-50%);
    width:380px; height:380px; opacity:0.95;
  }
  .c1-front .lockup {
    position:absolute; top:36px; left:40px;
    display:flex; align-items:center; gap:14px;
  }
  .c1-front .lockup img { width:44px; height:44px; }
  .c1-front .lockup-text { display:flex; flex-direction:column; line-height:1; }
  .c1-front .wordmark {
    font-size:28px; font-weight:800; letter-spacing:-0.02em;
    background: linear-gradient(90deg, #ffffff 0%, #67e8f9 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .c1-front .submark {
    margin-top:6px; font-size:9.5px; font-weight:600; letter-spacing:0.28em;
    color:#67e8f9;
  }
  .c1-front .tag-area {
    position:absolute; left:40px; bottom:38px; right:280px;
  }
  .c1-front .tag-eyebrow { color:#22d3ee; }
  .c1-front .tagline {
    margin-top:10px;
    font-size:24px; font-weight:700; line-height:1.2; letter-spacing:-0.01em;
    color:#f1f5f9;
    text-wrap: balance;
  }
  .c1-front .tagline em {
    font-style: normal;
    background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .c1-front .stamp {
    position:absolute; right:32px; top:32px;
    display:flex; align-items:center; gap:8px;
    padding:6px 10px;
    border:1px solid rgba(34,211,238,0.35);
    border-radius: 999px;
    background: rgba(34,211,238,0.06);
    backdrop-filter: blur(6px);
  }
  .c1-front .stamp .dot {
    width:6px; height:6px; border-radius:50%; background:#22d3ee;
    box-shadow: 0 0 10px #22d3ee, 0 0 0 4px rgba(34,211,238,0.15);
  }
  .c1-front .stamp .label { font-size:9.5px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#a5f3fc; }

  /* ───── Back (redesigned) ──────────────────────────────
     Full-bleed dark; centered name; large gradient monogram on the left,
     contact stack on the right separated by a thin gradient hairline. */
  .c1-back {
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(34,211,238,0.16) 0%, transparent 55%),
      radial-gradient(120% 100% at 100% 100%, rgba(124,58,237,0.20) 0%, transparent 55%),
      linear-gradient(180deg, #0C1222 0%, #162032 100%);
    color:#e2e8f0;
  }
  .c1-back .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(120% 90% at 50% 50%, #000 0%, transparent 75%);
  }
  .c1-back .glow-tl {
    position:absolute; top:-130px; left:-100px; width:340px; height:340px;
    background: radial-gradient(closest-side, rgba(34,211,238,0.40), transparent 70%);
    filter: blur(24px);
  }
  .c1-back .glow-br {
    position:absolute; bottom:-160px; right:-100px; width:380px; height:380px;
    background: radial-gradient(closest-side, rgba(124,58,237,0.45), transparent 70%);
    filter: blur(28px);
  }
  .c1-back .accent-bar {
    position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, #2563eb 0%, #7c3aed 50%, #06b6d4 100%);
  }

  /* Left column — monogram + role */
  .c1-back .left {
    position:absolute; left:44px; top:50px; bottom:44px; width:230px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .c1-back .monogram {
    display:flex; align-items:center; gap:14px;
  }
  .c1-back .monogram .mark {
    width:54px; height:54px; border-radius:14px;
    background: linear-gradient(135deg, rgba(6,182,212,0.18), rgba(124,58,237,0.18));
    border:1px solid rgba(255,255,255,0.10);
    display:flex; align-items:center; justify-content:center;
  }
  .c1-back .monogram .mark img { width:38px; height:38px; }
  .c1-back .monogram .word {
    font-size:18px; font-weight:800; letter-spacing:-0.02em; color:#fff; line-height:1;
  }
  .c1-back .monogram .word small {
    display:block; margin-top:6px;
    font-size:8.5px; font-weight:600; letter-spacing:0.26em;
    color:#67e8f9;
  }

  .c1-back .name {
    font-size:30px; font-weight:800; letter-spacing:-0.025em; line-height:1.02;
    color:#ffffff;
  }
  .c1-back .name .last {
    background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .c1-back .role {
    margin-top:8px;
    font-size:10.5px; font-weight:600; letter-spacing:0.22em;
    text-transform:uppercase;
    color:#94a3b8;
  }
  .c1-back .role .sep { color:#475569; margin:0 8px; }

  .c1-back .org {
    font-size:9px; font-weight:600; letter-spacing:0.24em;
    text-transform:uppercase; color:#64748b;
  }
  .c1-back .org b { color:#cbd5e1; font-weight:700; }

  /* Vertical hairline divider */
  .c1-back .vrule {
    position:absolute; top:60px; bottom:60px; left:300px; width:1px;
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.18) 30%, rgba(255,255,255,0.18) 70%, transparent 100%);
  }

  /* Right column — contact rows */
  .c1-back .contact {
    position:absolute; left:336px; right:44px; top:62px;
    display:flex; flex-direction:column; gap:18px;
  }
  .c1-back .row {
    display:flex; align-items:center; gap:14px;
    color:#e2e8f0;
  }
  .c1-back .row .ico {
    width:34px; height:34px; flex-shrink:0;
    border-radius:10px;
    background: linear-gradient(135deg, rgba(6,182,212,0.18), rgba(59,130,246,0.18));
    border: 1px solid rgba(255,255,255,0.10);
    display:flex; align-items:center; justify-content:center;
    color: #67e8f9;
  }
  .c1-back .row .lbl {
    display:block; font-size:8.5px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:#67e8f9;
    margin-bottom:3px;
  }
  .c1-back .row .val { font-size:14px; font-weight:600; letter-spacing:-0.005em; color:#f1f5f9; }
  .c1-back .row .val.mono { font-family: 'JetBrains Mono', monospace; font-weight:500; font-size:13px; white-space:nowrap; letter-spacing:0; }

  .c1-back .corner-stamp {
    position:absolute; right:32px; bottom:30px;
    display:flex; align-items:center; gap:8px;
    font-size:8.5px; font-weight:600; letter-spacing:0.24em;
    text-transform:uppercase; color:#64748b;
  }
  .c1-back .corner-stamp .pulse {
    width:6px; height:6px; border-radius:50%; background:#22d3ee;
    box-shadow: 0 0 8px #22d3ee, 0 0 0 3px rgba(34,211,238,0.18);
  }

  /* ─────────────────────────────────────────────────────
     CONCEPT 2 — "Aperture" : minimalist light card with shield aperture
     ───────────────────────────────────────────────────── */
  .c2-front {
    background: #f8fafc;
    color:#0f172a;
    overflow:hidden;
  }
  .c2-front .dots {
    position:absolute; inset:0;
    background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    background-size: 22px 22px;
    opacity:0.45;
    mask-image: radial-gradient(80% 110% at 0% 100%, #000 30%, transparent 70%);
  }
  .c2-front .corner {
    position:absolute; top:0; right:0; width:240px; height:240px;
    background: linear-gradient(135deg, rgba(37,99,235,0.10), rgba(124,58,237,0.10));
    clip-path: polygon(100% 0, 0 0, 100% 100%);
  }
  .c2-front .accent-stripe {
    position:absolute; top:0; right:0; width:240px; height:240px;
    background: linear-gradient(135deg, transparent 50%, #06b6d4 50%, #06b6d4 52%, transparent 52%);
    mix-blend-mode: multiply; opacity:0.55;
  }
  .c2-front .left {
    position:absolute; left:48px; top:48px; right:280px;
  }
  .c2-front .word {
    font-size:48px; font-weight:800; letter-spacing:-0.035em; line-height:1;
    color:#0f172a;
  }
  .c2-front .word .dot {
    color:#06b6d4;
  }
  .c2-front .sub {
    margin-top:12px;
    font-size:11px; font-weight:600;
    letter-spacing:0.32em; text-transform:uppercase;
    color:#475569;
  }
  .c2-front .tag {
    position:absolute; left:48px; bottom:42px; right:60px;
    font-size:14px; line-height:1.45; color:#334155;
    max-width: 380px;
  }
  .c2-front .tag em {
    font-style:normal; font-weight:700;
    background: linear-gradient(90deg, #1d4ed8, #6d28d9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .c2-front .aperture {
    position:absolute; right:42px; top:50%; transform:translateY(-50%);
    width:240px; height:240px;
  }

  /* Back of concept 2 */
  .c2-back {
    background: #f8fafc;
    color:#0f172a;
  }
  .c2-back .left-rail {
    position:absolute; left:0; top:0; bottom:0; width:14px;
    background: linear-gradient(180deg, #2563eb 0%, #7c3aed 50%, #06b6d4 100%);
  }
  .c2-back .top {
    position:absolute; left:48px; top:48px; right:48px;
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .c2-back .person {
    display:flex; flex-direction:column;
  }
  .c2-back .name {
    font-size:30px; font-weight:800; letter-spacing:-0.025em; color:#0f172a;
    line-height:1.05;
  }
  .c2-back .role {
    margin-top:4px;
    font-size:11px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase;
    color:#06b6d4;
  }
  .c2-back .right-mark img { width:48px; height:48px; }
  .c2-back .hr {
    position:absolute; left:48px; right:48px; top:130px;
    height:1px; background: linear-gradient(90deg, #cbd5e1, transparent);
  }
  .c2-back .info {
    position:absolute; left:48px; right:48px; top:158px;
    display:grid; grid-template-columns: 1fr 1fr; gap: 16px 28px;
  }
  .c2-back .item .lbl {
    font-size:9px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase;
    color:#94a3b8;
    display:flex; align-items:center; gap:6px;
  }
  .c2-back .item .lbl .pip { width:5px; height:5px; border-radius:50%; background:#06b6d4; }
  .c2-back .item .v {
    margin-top:5px;
    font-size:14px; font-weight:600; color:#0f172a;
    letter-spacing:-0.005em;
  }
  .c2-back .item .v.mono { font-family:'JetBrains Mono', monospace; font-weight:500; font-size:13.5px; }
  .c2-back .footer {
    position:absolute; left:48px; right:48px; bottom:36px;
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px dashed #cbd5e1; padding-top:18px;
  }
  .c2-back .footer .copy {
    font-size:10px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase;
    color:#64748b;
  }
  .c2-back .footer .copy b { color:#0f172a; font-weight:700; }
  .c2-back .footer .seal {
    display:flex; align-items:center; gap:8px;
    font-size:10px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#475569;
  }
  .c2-back .footer .seal .dot {
    width:6px; height:6px; border-radius:50%; background:#22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.18);
  }

  /* ─────────────────────────────────────────────────────
     CONCEPT 3 — "Terminal / Manifest" — JetBrains-mono boarding-pass style
     ───────────────────────────────────────────────────── */
  .c3-front {
    background: linear-gradient(180deg, #020617 0%, #0C1222 100%);
    color:#e2e8f0;
    overflow:hidden;
  }
  .c3-front .scan {
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(34,211,238,0.05) 0px, rgba(34,211,238,0.05) 1px, transparent 1px, transparent 4px);
    pointer-events:none;
    mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
  }
  .c3-front .glow {
    position:absolute; top:-120px; right:-120px; width:380px; height:380px;
    background: radial-gradient(closest-side, rgba(124,58,237,0.45), transparent 70%);
    filter: blur(30px);
  }
  .c3-front .glow2 {
    position:absolute; bottom:-160px; left:-100px; width:380px; height:380px;
    background: radial-gradient(closest-side, rgba(6,182,212,0.4), transparent 70%);
    filter: blur(30px);
  }
  .c3-front .head {
    position:absolute; top:36px; left:40px; right:40px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:#67e8f9;
    letter-spacing: 0.12em;
  }
  .c3-front .head .l { display:flex; align-items:center; gap:8px; }
  .c3-front .head .pulse {
    width:7px; height:7px; border-radius:50%; background:#22d3ee;
    box-shadow: 0 0 0 4px rgba(34,211,238,0.18), 0 0 12px #22d3ee;
  }
  .c3-front .center {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    text-align:center; width: 80%;
  }
  .c3-front .name {
    font-size:46px; font-weight:800; letter-spacing:-0.035em; line-height:1;
    color:#ffffff;
  }
  .c3-front .name .accent {
    background: linear-gradient(90deg, #22d3ee 0%, #60a5fa 50%, #a78bfa 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .c3-front .underline {
    margin: 18px auto 16px;
    width: 64px; height:2px;
    background: linear-gradient(90deg, transparent, #22d3ee, transparent);
  }
  .c3-front .role-line {
    font-family: 'JetBrains Mono', monospace;
    font-size:11px; color:#94a3b8; letter-spacing:0.16em;
  }
  .c3-front .role-line .gt { color:#22d3ee; }
  .c3-front .foot {
    position:absolute; bottom:30px; left:40px; right:40px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; letter-spacing:0.14em;
    color:#64748b;
  }
  .c3-front .foot .url { color:#e2e8f0; font-weight:600; }
  .c3-front .foot .url span { color:#22d3ee; }

  /* Back of concept 3 — manifest style */
  .c3-back {
    background: linear-gradient(180deg, #020617 0%, #0C1222 100%);
    color:#e2e8f0;
    font-family:'JetBrains Mono', monospace;
  }
  .c3-back .scan {
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(34,211,238,0.04) 0px, rgba(34,211,238,0.04) 1px, transparent 1px, transparent 4px);
    pointer-events:none;
  }
  .c3-back .glow {
    position:absolute; bottom:-160px; right:-100px; width:380px; height:380px;
    background: radial-gradient(closest-side, rgba(34,211,238,0.32), transparent 70%);
    filter: blur(30px);
  }
  .c3-back .head {
    position:absolute; top:30px; left:40px; right:40px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:9.5px; letter-spacing:0.16em; color:#67e8f9;
  }
  .c3-back .head .badge {
    display:flex; align-items:center; gap:8px;
    border:1px solid rgba(34,211,238,0.4);
    border-radius:999px; padding:5px 10px;
    background: rgba(34,211,238,0.06);
  }
  .c3-back .head .badge .pulse {
    width:6px; height:6px; border-radius:50%; background:#22d3ee;
    box-shadow: 0 0 8px #22d3ee;
  }
  .c3-back .lockup {
    display:flex; align-items:center; gap:8px;
    font-family:'Inter', sans-serif;
  }
  .c3-back .lockup img { width:24px; height:24px; }
  .c3-back .lockup .word {
    font-weight:700; letter-spacing:-0.01em; font-size:14px; color:#fff;
  }

  .c3-back .grid {
    position:absolute; top:80px; left:40px; right:40px; bottom:80px;
    display:grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px 30px;
    align-content:start;
  }
  .c3-back .field {
    border-top: 1px dashed rgba(255,255,255,0.12);
    padding-top: 10px;
  }
  .c3-back .field .k {
    font-size:8.5px; letter-spacing:0.22em; color:#67e8f9;
  }
  .c3-back .field .v {
    margin-top:5px; font-size:13px; font-weight:500; color:#f1f5f9;
    letter-spacing:0.01em;
  }
  .c3-back .field .v.lg { font-size:16px; font-weight:600; font-family:'Inter', sans-serif; letter-spacing:-0.01em; }
  .c3-back .field.full { grid-column: 1 / -1; }

  .c3-back .perforation {
    position:absolute; top:0; bottom:0; left:62%;
    width:1px;
    background-image: linear-gradient(180deg, rgba(255,255,255,0.18) 50%, transparent 50%);
    background-size: 1px 8px;
  }
  .c3-back .stub {
    position:absolute; right:0; top:0; bottom:0; width:38%;
    padding: 30px 32px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(34,211,238,0.18) 0%, transparent 60%),
      radial-gradient(120% 100% at 0% 100%, rgba(124,58,237,0.22) 0%, transparent 55%),
      linear-gradient(180deg, #0C1222 0%, #162032 100%);
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.04);
  }
  .c3-back .stub .stub-k {
    font-size:8.5px; letter-spacing:0.22em; color:#67e8f9;
  }
  .c3-back .stub .stub-v {
    margin-top:6px; font-family:'Inter', sans-serif;
    font-size: 22px; font-weight:800; letter-spacing:-0.02em;
    color:#fff;
    line-height:1.05;
  }
  .c3-back .stub .stub-tag {
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:11px; font-weight:500; line-height:1.4;
    color:#cbd5e1;
    text-wrap: balance;
  }
  .c3-back .stub .stub-tag em { font-style:normal; color:#67e8f9; font-weight:600;}
  .c3-back .stub .qr {
    margin-top:auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
  }
  .c3-back .stub .qr .qr-box {
    width:70px; height:70px;
    background:
      linear-gradient(#0C1222,#0C1222) padding-box,
      linear-gradient(135deg, #22d3ee, #7c3aed) border-box;
    border:1.5px solid transparent;
    border-radius:8px;
    position:relative; overflow:hidden;
  }
  .c3-back .stub .qr .qr-box .pat {
    position:absolute; inset:8px;
    background-image:
      radial-gradient(rgba(34,211,238,0.85) 1px, transparent 1.4px);
    background-size: 7px 7px;
    opacity:0.85;
  }
  /* anchor squares for QR realism */
  .c3-back .stub .qr .qr-box::before,
  .c3-back .stub .qr .qr-box::after {
    content:""; position:absolute; width:14px; height:14px;
    border:2px solid #22d3ee; border-radius:2px; background:transparent;
  }
  .c3-back .stub .qr .qr-box::before { top:6px; left:6px; }
  .c3-back .stub .qr .qr-box::after  { top:6px; right:6px; }
  .c3-back .stub .qr .qr-cap {
    text-align:right;
  }
  .c3-back .stub .qr .qr-cap .k {
    font-size:8.5px; letter-spacing:0.22em; color:#67e8f9;
  }
  .c3-back .stub .qr .qr-cap .v {
    margin-top:4px; font-family:'Inter', sans-serif; font-size:12px; font-weight:600; color:#fff;
  }

  /* ─────────────────────────────────────────────────────
     Pair — show front + back side by side, with edge label
     ───────────────────────────────────────────────────── */
  .pair {
    display:flex; gap:32px; align-items:center;
    padding: 28px 36px;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(59,130,246,0.06) 0%, transparent 60%),
      #0a0e1a;
    border-radius: 24px;
  }
  .face-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .face-tag {
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:#64748b; letter-spacing:0.22em; text-transform:uppercase;
  }
  .face-tag .pulse {
    display:inline-block; vertical-align:middle; margin-right:8px;
    width:5px; height:5px; border-radius:50%; background:#22d3ee;
  }

  /* Subtle perspective tilt option (concept hero) */
  .hero {
    perspective: 1800px;
  }
  .hero .pair { transform: rotateY(-3deg) rotateX(4deg); }

</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<div id="root"></div>

<script type="text/babel">
const { useEffect } = React;

/* ─────────────────────────────────────────────────────
   Reusable: Network logo SVG (the dot graph)
   ───────────────────────────────────────────────────── */
function NetworkSVG({ tone = "cyan", style }) {
  const colors = tone === "cyan"
    ? { node:"#22D3EE", line:"#22D3EE", shield:"#3B82F6" }
    : { node:"#0891B2", line:"#0891B2", shield:"#1D4ED8" };
  return (
    <svg viewBox="0 0 120 120" style={style} fill="none">
      <path d="M60 18L28 34V60C28 78 41 93 60 98C79 93 92 78 92 60V34L60 18Z"
        stroke={colors.shield} strokeWidth="1" fill="none" opacity="0.35"></path>
      {/* nodes */}
      {[
        [60,30,4,1],[45,42,3.5,0.8],[60,42,3.5,1],[75,42,3.5,0.8],
        [38,55,3,0.6],[52,55,3.5,0.9],[68,55,3.5,0.9],[82,55,3,0.6],
        [45,68,3,0.7],[60,68,4,1],[75,68,3,0.7],
        [52,80,2.5,0.5],[60,80,3,0.7],[68,80,2.5,0.5],
        [60,90,2,0.4],
      ].map((n,i) => (
        <circle key={i} cx={n[0]} cy={n[1]} r={n[2]} fill={colors.node} opacity={n[3]} />
      ))}
      {/* lines */}
      {[
        [60,30,45,42,0.3],[60,30,75,42,0.3],[60,30,60,42,0.4],
        [45,42,38,55,0.25],[45,42,52,55,0.3],[60,42,52,55,0.35],[60,42,68,55,0.35],
        [75,42,68,55,0.3],[75,42,82,55,0.25],
        [52,55,45,68,0.3],[52,55,60,68,0.35],[68,55,60,68,0.35],[68,55,75,68,0.3],
        [45,68,52,80,0.25],[60,68,60,80,0.3],[75,68,68,80,0.25],[60,80,60,90,0.2],
      ].map((l,i) => (
        <line key={i} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} stroke={colors.line} strokeWidth="1" opacity={l[4]} />
      ))}
    </svg>
  );
}

/* Aperture mark: shield + concentric ring + center dot */
function ApertureMark() {
  return (
    <svg viewBox="0 0 240 240" width="240" height="240" fill="none">
      <defs>
        <linearGradient id="ap-stroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#2563eb" />
          <stop offset="100%" stopColor="#06b6d4" />
        </linearGradient>
        <linearGradient id="ap-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#0C1222" />
          <stop offset="100%" stopColor="#162032" />
        </linearGradient>
      </defs>
      {/* outer thin ring */}
      <circle cx="120" cy="120" r="108" stroke="#cbd5e1" strokeWidth="1" />
      <circle cx="120" cy="120" r="92"  stroke="url(#ap-stroke)" strokeWidth="1.25" opacity="0.65" />
      {/* shield silhouette */}
      <path d="M120 36L52 70V126C52 164 80 196 120 206C160 196 188 164 188 126V70L120 36Z"
        fill="url(#ap-fill)" stroke="url(#ap-stroke)" strokeWidth="1.5" />
      {/* small network inside */}
      <g transform="translate(60,38) scale(1)">
        <NetworkSVG tone="cyan" style={{width:120, height:120}} />
      </g>
      {/* concentric tick marks */}
      {[0,45,90,135,180,225,270,315].map(a => {
        const rad = (a*Math.PI)/180;
        const x1 = 120 + Math.cos(rad)*116;
        const y1 = 120 + Math.sin(rad)*116;
        const x2 = 120 + Math.cos(rad)*120;
        const y2 = 120 + Math.sin(rad)*120;
        return <line key={a} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#94a3b8" strokeWidth="1" />;
      })}
    </svg>
  );
}

/* ─────────────────────────────────────────────────────
   Tiny inline icons (Lucide-style strokes)
   ───────────────────────────────────────────────────── */
const stroke = { stroke:"currentColor", strokeWidth:1.6, fill:"none", strokeLinecap:"round", strokeLinejoin:"round" };
const Icon = {
  Globe: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" {...stroke}>
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
    </svg>),
  Mail: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" {...stroke}>
      <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
    </svg>),
  Phone: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" {...stroke}>
      <path d="M22 16.92V21a1 1 0 0 1-1.1 1 19 19 0 0 1-8.3-3.06 18.7 18.7 0 0 1-6-6A19 19 0 0 1 3.5 4.6 1 1 0 0 1 4.5 3.5h4.1a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.27 1L8.6 10.7a16 16 0 0 0 6 6l1.4-1.7a1 1 0 0 1 1-.27l4 1A1 1 0 0 1 22 16.92Z"/>
    </svg>),
  Pin: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" {...stroke}>
      <path d="M12 22s7-7.6 7-12a7 7 0 1 0-14 0c0 4.4 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>
    </svg>),
  Linkedin: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" {...stroke}>
      <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v8M8 7v.01M12 18v-5a3 3 0 0 1 6 0v5"/>
    </svg>),
};

/* ─────────────────────────────────────────────────────
   CONCEPT 1 — Network graph
   ───────────────────────────────────────────────────── */
function C1Front() {
  return (
    <div className="card c1-front">
      <div className="grid"></div>
      <div className="glow-tl"></div>
      <div className="glow-br"></div>

      <NetworkSVG className="net" style={{ position:"absolute", right:-30, top:"50%", transform:"translateY(-50%)", width:380, height:380, opacity:0.95 }} />

      <div className="lockup">
        <img src="assets/icon-monochrome-white.svg" alt="" />
        <div className="lockup-text">
          <div className="wordmark">Shieldra</div>
          <div className="submark">AI · COMPLIANCE</div>
        </div>
      </div>

      <div className="stamp">
        <span className="dot"></span>
        <span className="label">Always On</span>
      </div>

      <div className="tag-area">
        <div className="eyebrow tag-eyebrow">Tagline</div>
        <div className="tagline">The regulatory AI that <em>shields</em> your business.</div>
      </div>
    </div>
  );
}

function C1Back() {
  return (
    <div className="card c1-back">
      <div className="grid"></div>
      <div className="glow-tl"></div>
      <div className="glow-br"></div>
      <div className="accent-bar"></div>

      <div className="left">
        <div className="monogram">
          <div className="mark"><img src="assets/icon-monochrome-white.svg" alt="" /></div>
          <div className="word">Shieldra<small>AI · COMPLIANCE</small></div>
        </div>

        <div>
          <div className="name">Sam <span className="last">Sedai</span></div>
          <div className="role">Founder <span className="sep">/</span> CEO</div>
        </div>

        <div className="org">A <b>Nexzen Software</b> Co.</div>
      </div>

      <div className="vrule"></div>

      <div className="contact">
        <div className="row">
          <div className="ico"><Icon.Mail /></div>
          <div>
            <span className="lbl">Email</span>
            <span className="val">sam@shieldra.ai</span>
          </div>
        </div>
        <div className="row">
          <div className="ico"><Icon.Phone /></div>
          <div>
            <span className="lbl">Direct</span>
            <span className="val mono">+1 346.689.2448</span>
          </div>
        </div>
        <div className="row">
          <div className="ico"><Icon.Globe /></div>
          <div>
            <span className="lbl">Web</span>
            <span className="val">shieldra.ai</span>
          </div>
        </div>
      </div>

      <div className="corner-stamp">
        <span className="pulse"></span>
        <span>Secure Channel</span>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   CONCEPT 2 — Aperture (light, minimal)
   ───────────────────────────────────────────────────── */
function C2Front() {
  return (
    <div className="card c2-front">
      <div className="dots"></div>
      <div className="corner"></div>
      <div className="accent-stripe"></div>

      <div className="left">
        <div className="word">shieldra<span className="dot">.</span></div>
        <div className="sub">AI Compliance · Healthcare</div>
      </div>

      <div className="aperture">
        <ApertureMark />
      </div>

      <div className="tag">
        The regulatory AI that <em>shields</em> your business — automating HIPAA, SOC 2, and ISO 27001 end‑to‑end.
      </div>
    </div>
  );
}

function C2Back() {
  return (
    <div className="card c2-back">
      <div className="left-rail"></div>
      <div className="top">
        <div className="person">
          <div className="name">Sam Karim</div>
          <div className="role">Founder · CEO</div>
        </div>
        <div className="right-mark">
          <img src="assets/icon-primary.svg" alt="Shieldra" />
        </div>
      </div>
      <div className="hr"></div>

      <div className="info">
        <div className="item">
          <div className="lbl"><span className="pip"></span>Email</div>
          <div className="v">sam@shieldra.ai</div>
        </div>
        <div className="item">
          <div className="lbl"><span className="pip"></span>Direct</div>
          <div className="v mono">+1 346·689·2448</div>
        </div>
        <div className="item">
          <div className="lbl"><span className="pip"></span>Web</div>
          <div className="v">shieldra.ai</div>
        </div>
        <div className="item">
          <div className="lbl"><span className="pip"></span>LinkedIn</div>
          <div className="v">/in/shieldra</div>
        </div>
      </div>

      <div className="footer">
        <div className="copy">A <b>Nexzen Software</b> Company · Houston, TX</div>
        <div className="seal"><span className="dot"></span> SOC 2 · HIPAA Ready</div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   CONCEPT 3 — Manifest / Boarding pass
   ───────────────────────────────────────────────────── */
function C3Front() {
  return (
    <div className="card c3-front">
      <div className="scan"></div>
      <div className="glow"></div>
      <div className="glow2"></div>

      <div className="head">
        <div className="l"><span className="pulse"></span><span>SHIELDRA · AGENT // SYS.ONLINE</span></div>
        <div>RTV-0429-A</div>
      </div>

      <div className="center">
        <div className="name">Sam <span className="accent">Karim</span></div>
        <div className="underline"></div>
        <div className="role-line"><span className="gt">&gt;</span> founder &amp; ceo · shieldra.ai</div>
      </div>

      <div className="foot">
        <div>v.2026 · ISSUED HOUSTON</div>
        <div className="url">shieldra<span>.ai</span></div>
      </div>
    </div>
  );
}

function C3Back() {
  return (
    <div className="card c3-back">
      <div className="scan"></div>
      <div className="glow"></div>

      <div className="head">
        <div className="lockup">
          <img src="assets/icon-monochrome-white.svg" alt="" />
          <span className="word">Shieldra</span>
        </div>
        <div className="badge"><span className="pulse"></span><span>SECURE CHANNEL</span></div>
      </div>

      <div className="grid">
        <div className="field full">
          <div className="k">PASSENGER</div>
          <div className="v lg">SAM KARIM</div>
        </div>

        <div className="field">
          <div className="k">EMAIL</div>
          <div className="v">sam@shieldra.ai</div>
        </div>
        <div className="field">
          <div className="k">DIRECT</div>
          <div className="v">+1 346.689.2448</div>
        </div>

        <div className="field">
          <div className="k">ROLE</div>
          <div className="v">Founder · CEO</div>
        </div>
        <div className="field">
          <div className="k">ORG</div>
          <div className="v">Nexzen Software</div>
        </div>
      </div>

      <div className="perforation"></div>

      <div className="stub">
        <div>
          <div className="stub-k">DESTINATION</div>
          <div className="stub-v">Audit‑Ready</div>
          <div className="stub-tag">The regulatory AI that <em>shields</em> your business.</div>
        </div>

        <div className="qr">
          <div className="qr-box"><div className="pat"></div></div>
          <div className="qr-cap">
            <div className="k">SCAN</div>
            <div className="v">shieldra.ai</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   Card pair wrapper
   ───────────────────────────────────────────────────── */
function Pair({ front, back }) {
  return (
    <div className="pair">
      <div className="face-wrap">
        <div>{front}</div>
        <div className="face-tag"><span className="pulse"></span>FRONT</div>
      </div>
      <div className="face-wrap">
        <div>{back}</div>
        <div className="face-tag"><span className="pulse"></span>BACK</div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────
   Canvas layout
   ───────────────────────────────────────────────────── */
function App() {
  // Each pair: 700+700+gap(32) + padding(72) ≈ 1504, height ≈ 400+padding+tag
  const pairW = 700*2 + 32 + 36*2; // 1504
  const pairH = 400 + 28*2 + 30;   // ~486

  return (
    <DesignCanvas title="Shieldra — Business Card · Concepts">
      <DCSection id="concepts" title="Three concepts · 3.5 × 2 in (700×400 px @ 200dpi)">
        <DCArtboard id="c1" label="01 — Network Graph · dark front, light back with framework chips" width={pairW} height={pairH}>
          <Pair front={<C1Front />} back={<C1Back />} />
        </DCArtboard>

        <DCArtboard id="c2" label="02 — Aperture · light, minimal, premium feel" width={pairW} height={pairH}>
          <Pair front={<C2Front />} back={<C2Back />} />
        </DCArtboard>

        <DCArtboard id="c3" label="03 — Secure Manifest · futuristic, monospace, boarding-pass back" width={pairW} height={pairH}>
          <Pair front={<C3Front />} back={<C3Back />} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
