<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" font-family="Inter, system-ui, sans-serif">
  <!-- ============================================================
       SHIELDRA LEARNING ENGINE – Investor Infographic
       Flow: Tenant Inputs → Privacy Gate → Learning Core →
             Intelligence Outputs → Tenant Benefits → (Flywheel loop)
       ============================================================ -->

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1028"/>
    </linearGradient>

    <!-- Card fill -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111d3d"/>
    </linearGradient>

    <!-- Stage accents -->
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Arrowheads per stage color -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#06b6d4"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>

    <!-- Soft glow for flywheel -->
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ───────────── Canvas ───────────── -->
  <rect width="1800" height="1200" fill="url(#bg)"/>

  <!-- Header -->
  <text x="900" y="70" text-anchor="middle" font-size="42" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
    Shieldra Learning Engine
  </text>
  <text x="900" y="108" text-anchor="middle" font-size="20" fill="#94a3b8" font-weight="400">
    How one customer's expertise makes every customer's compliance stronger — without ever sharing their data.
  </text>

  <!-- Decorative divider -->
  <line x1="300" y1="138" x2="1500" y2="138" stroke="#1e293b" stroke-width="1"/>

  <!-- =======================================================
       STAGE 1 – TENANT INPUTS
       ======================================================= -->
  <g transform="translate(40,180)">
    <rect width="300" height="470" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="56" rx="14" fill="url(#accentCyan)"/>
    <rect x="0" y="42" width="300" height="14" fill="url(#accentCyan)"/>
    <text x="20" y="35" font-size="13" font-weight="600" fill="#cffafe" letter-spacing="2">STAGE 1</text>
    <text x="20" y="82" font-size="22" font-weight="700" fill="#f1f5f9">Tenant Inputs</text>
    <text x="20" y="106" font-size="13" fill="#94a3b8">Every action becomes signal.</text>

    <g font-size="13" fill="#cbd5e1">
      <circle cx="18" cy="146" r="4" fill="#06b6d4"/>
      <text x="32" y="150" font-weight="600" fill="#f1f5f9">Documents uploaded</text>
      <text x="32" y="168" fill="#94a3b8">Policies, BAAs, procedures, evidence</text>

      <circle cx="18" cy="204" r="4" fill="#06b6d4"/>
      <text x="32" y="208" font-weight="600" fill="#f1f5f9">Scan findings</text>
      <text x="32" y="226" fill="#94a3b8">73 HIPAA requirements analyzed per org</text>

      <circle cx="18" cy="262" r="4" fill="#06b6d4"/>
      <text x="32" y="266" font-weight="600" fill="#f1f5f9">Expert corrections</text>
      <text x="32" y="284" fill="#94a3b8">"This wasn't a violation — here's why"</text>

      <circle cx="18" cy="320" r="4" fill="#06b6d4"/>
      <text x="32" y="324" font-weight="600" fill="#f1f5f9">Recommendation outcomes</text>
      <text x="32" y="342" fill="#94a3b8">Accepted · rejected · effective · ineffective</text>

      <circle cx="18" cy="378" r="4" fill="#06b6d4"/>
      <text x="32" y="382" font-weight="600" fill="#f1f5f9">Regulatory feeds</text>
      <text x="32" y="400" fill="#94a3b8">Federal Register, HHS OCR, CISA, NIST</text>
    </g>

    <rect x="16" y="420" width="268" height="36" rx="8" fill="#0b1028" stroke="#164e63"/>
    <text x="150" y="442" text-anchor="middle" font-size="12" fill="#67e8f9" font-weight="600" letter-spacing="1">
      AUTO-CAPTURED · ZERO EXTRA WORK
    </text>
  </g>

  <!-- Arrow 1 → 2 -->
  <line x1="350" y1="415" x2="388" y2="415" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrCyan)"/>

  <!-- =======================================================
       STAGE 2 – PRIVACY GATE
       ======================================================= -->
  <g transform="translate(400,180)">
    <rect width="300" height="470" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="56" rx="14" fill="url(#accentAmber)"/>
    <rect x="0" y="42" width="300" height="14" fill="url(#accentAmber)"/>
    <text x="20" y="35" font-size="13" font-weight="600" fill="#fef3c7" letter-spacing="2">STAGE 2</text>
    <text x="20" y="82" font-size="22" font-weight="700" fill="#f1f5f9">Privacy Gate</text>
    <text x="20" y="106" font-size="13" fill="#94a3b8">Nothing passes without scrubbing.</text>

    <g font-size="13" fill="#cbd5e1">
      <circle cx="18" cy="146" r="4" fill="#f59e0b"/>
      <text x="32" y="150" font-weight="600" fill="#f1f5f9">PHI Scrubber</text>
      <text x="32" y="168" fill="#94a3b8">Names, emails, MRN, SSN, phones masked</text>

      <circle cx="18" cy="204" r="4" fill="#f59e0b"/>
      <text x="32" y="208" font-weight="600" fill="#f1f5f9">Tenant scope lock</text>
      <text x="32" y="226" fill="#94a3b8">Postgres RLS enforces org isolation</text>

      <circle cx="18" cy="262" r="4" fill="#f59e0b"/>
      <text x="32" y="266" font-weight="600" fill="#f1f5f9">k-anonymity threshold</text>
      <text x="32" y="284" fill="#94a3b8">A pattern only shared if ≥ k distinct orgs</text>

      <circle cx="18" cy="320" r="4" fill="#f59e0b"/>
      <text x="32" y="324" font-weight="600" fill="#f1f5f9">One-way salt hash</text>
      <text x="32" y="342" fill="#94a3b8">Org identity irrecoverable in shared data</text>

      <circle cx="18" cy="378" r="4" fill="#f59e0b"/>
      <text x="32" y="382" font-weight="600" fill="#f1f5f9">Scope tagging</text>
      <text x="32" y="400" fill="#94a3b8">Every chunk = tenant | platform</text>
    </g>

    <rect x="16" y="420" width="268" height="36" rx="8" fill="#0b1028" stroke="#78350f"/>
    <text x="150" y="442" text-anchor="middle" font-size="12" fill="#fbbf24" font-weight="600" letter-spacing="1">
      HIPAA-SAFE BY CONSTRUCTION
    </text>
  </g>

  <!-- Arrow 2 → 3 -->
  <line x1="710" y1="415" x2="748" y2="415" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>

  <!-- =======================================================
       STAGE 3 – LEARNING CORE
       ======================================================= -->
  <g transform="translate(760,180)">
    <rect width="300" height="470" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="56" rx="14" fill="url(#accentBlue)"/>
    <rect x="0" y="42" width="300" height="14" fill="url(#accentBlue)"/>
    <text x="20" y="35" font-size="13" font-weight="600" fill="#dbeafe" letter-spacing="2">STAGE 3</text>
    <text x="20" y="82" font-size="22" font-weight="700" fill="#f1f5f9">Learning Core</text>
    <text x="20" y="106" font-size="13" fill="#94a3b8">Five systems, one compounding brain.</text>

    <g font-size="13" fill="#cbd5e1">
      <circle cx="18" cy="146" r="4" fill="#3b82f6"/>
      <text x="32" y="150" font-weight="600" fill="#f1f5f9">RAG Retrieval</text>
      <text x="32" y="168" fill="#94a3b8">Semantic search · tenant + platform chunks</text>

      <circle cx="18" cy="204" r="4" fill="#3b82f6"/>
      <text x="32" y="208" font-weight="600" fill="#f1f5f9">Knowledge Graph</text>
      <text x="32" y="226" fill="#94a3b8">Requirements · controls · findings · corrections</text>

      <circle cx="18" cy="262" r="4" fill="#3b82f6"/>
      <text x="32" y="266" font-weight="600" fill="#f1f5f9">Pattern Library</text>
      <text x="32" y="284" fill="#94a3b8">Anonymized cross-tenant compliance patterns</text>

      <circle cx="18" cy="320" r="4" fill="#3b82f6"/>
      <text x="32" y="324" font-weight="600" fill="#f1f5f9">Corrections Store</text>
      <text x="32" y="342" fill="#94a3b8">Ranks by 0.6·quality + 0.4·usage</text>

      <circle cx="18" cy="378" r="4" fill="#3b82f6"/>
      <text x="32" y="382" font-weight="600" fill="#f1f5f9">Adaptive Prompts</text>
      <text x="32" y="400" fill="#94a3b8">A/B tests templates, picks the winner</text>
    </g>

    <rect x="16" y="420" width="268" height="36" rx="8" fill="#0b1028" stroke="#1e40af"/>
    <text x="150" y="442" text-anchor="middle" font-size="12" fill="#93c5fd" font-weight="600" letter-spacing="1">
      GETS SMARTER EVERY DAY
    </text>
  </g>

  <!-- Arrow 3 → 4 -->
  <line x1="1070" y1="415" x2="1108" y2="415" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrBlue)"/>

  <!-- =======================================================
       STAGE 4 – INTELLIGENCE OUTPUTS
       ======================================================= -->
  <g transform="translate(1120,180)">
    <rect width="300" height="470" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="56" rx="14" fill="url(#accentViolet)"/>
    <rect x="0" y="42" width="300" height="14" fill="url(#accentViolet)"/>
    <text x="20" y="35" font-size="13" font-weight="600" fill="#ede9fe" letter-spacing="2">STAGE 4</text>
    <text x="20" y="82" font-size="22" font-weight="700" fill="#f1f5f9">Intelligence Outputs</text>
    <text x="20" y="106" font-size="13" fill="#94a3b8">What the core produces, on demand.</text>

    <g font-size="13" fill="#cbd5e1">
      <circle cx="18" cy="146" r="4" fill="#8b5cf6"/>
      <text x="32" y="150" font-weight="600" fill="#f1f5f9">Risk Analysis Co-pilot</text>
      <text x="32" y="168" fill="#94a3b8">One-call risk score, factor breakdown</text>

      <circle cx="18" cy="204" r="4" fill="#8b5cf6"/>
      <text x="32" y="208" font-weight="600" fill="#f1f5f9">Peer Failure Heatmap</text>
      <text x="32" y="226" fill="#94a3b8">"N% of peers fail CFR 164.308(a)(4)"</text>

      <circle cx="18" cy="262" r="4" fill="#8b5cf6"/>
      <text x="32" y="266" font-weight="600" fill="#f1f5f9">Proactive Gap Alerts</text>
      <text x="32" y="284" fill="#94a3b8">"Your stack matches 12 orgs that failed X"</text>

      <circle cx="18" cy="320" r="4" fill="#8b5cf6"/>
      <text x="32" y="324" font-weight="600" fill="#f1f5f9">Calibrated Confidence</text>
      <text x="32" y="342" fill="#94a3b8">AI flags findings only when historically right</text>

      <circle cx="18" cy="378" r="4" fill="#8b5cf6"/>
      <text x="32" y="382" font-weight="600" fill="#f1f5f9">Grounded LLM answers</text>
      <text x="32" y="400" fill="#94a3b8">Cites chunks, corrections, and patterns</text>
    </g>

    <rect x="16" y="420" width="268" height="36" rx="8" fill="#0b1028" stroke="#5b21b6"/>
    <text x="150" y="442" text-anchor="middle" font-size="12" fill="#c4b5fd" font-weight="600" letter-spacing="1">
      DEFENSIBLE INTELLIGENCE
    </text>
  </g>

  <!-- Arrow 4 → 5 -->
  <line x1="1430" y1="415" x2="1468" y2="415" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrViolet)"/>

  <!-- =======================================================
       STAGE 5 – TENANT BENEFITS
       ======================================================= -->
  <g transform="translate(1480,180)">
    <rect width="280" height="470" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="56" rx="14" fill="url(#accentGreen)"/>
    <rect x="0" y="42" width="280" height="14" fill="url(#accentGreen)"/>
    <text x="20" y="35" font-size="13" font-weight="600" fill="#d1fae5" letter-spacing="2">STAGE 5</text>
    <text x="20" y="82" font-size="22" font-weight="700" fill="#f1f5f9">Tenant Benefits</text>
    <text x="20" y="106" font-size="13" fill="#94a3b8">What customers actually get.</text>

    <g font-size="13" fill="#cbd5e1">
      <circle cx="18" cy="146" r="4" fill="#10b981"/>
      <text x="32" y="150" font-weight="600" fill="#f1f5f9">Accuracy climbs weekly</text>
      <text x="32" y="168" fill="#94a3b8">Corrections + adaptive prompts compound</text>

      <circle cx="18" cy="204" r="4" fill="#10b981"/>
      <text x="32" y="208" font-weight="600" fill="#f1f5f9">Fewer false positives</text>
      <text x="32" y="226" fill="#94a3b8">Quality-weighted retrieval surfaces trust</text>

      <circle cx="18" cy="262" r="4" fill="#10b981"/>
      <text x="32" y="266" font-weight="600" fill="#f1f5f9">Early-warning on audits</text>
      <text x="32" y="284" fill="#94a3b8">Peer patterns predict what OCR asks</text>

      <circle cx="18" cy="320" r="4" fill="#10b981"/>
      <text x="32" y="324" font-weight="600" fill="#f1f5f9">Safe peer benchmarking</text>
      <text x="32" y="342" fill="#94a3b8">Compare gaps without exposing data</text>

      <circle cx="18" cy="378" r="4" fill="#10b981"/>
      <text x="32" y="382" font-weight="600" fill="#f1f5f9">Faster audit prep</text>
      <text x="32" y="400" fill="#94a3b8">Graph-based evidence mapping, auto-cited</text>
    </g>

    <rect x="16" y="420" width="248" height="36" rx="8" fill="#0b1028" stroke="#047857"/>
    <text x="140" y="442" text-anchor="middle" font-size="12" fill="#6ee7b7" font-weight="600" letter-spacing="1">
      MEASURABLE OUTCOMES
    </text>
  </g>

  <!-- =======================================================
       FLYWHEEL LOOP
       ======================================================= -->
  <g transform="translate(0,710)">
    <!-- Curved loop arrow going right-to-left under the pipeline -->
    <path d="M 1620,0 C 1620,140 1620,220 1200,220 L 400,220 C 100,220 100,140 100,0"
          stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 6" fill="none"
          marker-end="url(#arrLoop)" opacity="0.85"/>
    <text x="900" y="195" text-anchor="middle" font-size="16" fill="#22d3ee" font-weight="600" letter-spacing="1">
      FLYWHEEL · EACH CORRECTION SHARPENS EVERY FUTURE PREDICTION
    </text>
  </g>

  <!-- =======================================================
       BOTTOM: "Why this is a moat" card row
       ======================================================= -->
  <g transform="translate(40,960)">
    <rect width="1720" height="210" rx="16" fill="#0b1028" stroke="#1e293b"/>
    <text x="40" y="42" font-size="20" font-weight="700" fill="#f1f5f9">Why this is a defensible moat</text>
    <text x="40" y="68" font-size="13" fill="#94a3b8">The engine's outputs get stronger with every customer — and competitors can't catch up without the same privacy-safe network effects.</text>

    <!-- Metric tile 1 -->
    <g transform="translate(40,94)">
      <rect width="380" height="90" rx="10" fill="#0f172a" stroke="#164e63"/>
      <text x="20" y="30" font-size="11" fill="#67e8f9" font-weight="600" letter-spacing="1.5">NETWORK EFFECT</text>
      <text x="20" y="58" font-size="17" font-weight="700" fill="#f1f5f9">More tenants → stronger patterns</text>
      <text x="20" y="78" font-size="12" fill="#94a3b8">Peer heatmap accuracy compounds with org count</text>
    </g>

    <!-- Metric tile 2 -->
    <g transform="translate(440,94)">
      <rect width="380" height="90" rx="10" fill="#0f172a" stroke="#78350f"/>
      <text x="20" y="30" font-size="11" fill="#fbbf24" font-weight="600" letter-spacing="1.5">PRIVACY-NATIVE</text>
      <text x="20" y="58" font-size="17" font-weight="700" fill="#f1f5f9">k-anonymity + PHI scrubbing</text>
      <text x="20" y="78" font-size="12" fill="#94a3b8">Cross-tenant learning without HIPAA exposure</text>
    </g>

    <!-- Metric tile 3 -->
    <g transform="translate(840,94)">
      <rect width="380" height="90" rx="10" fill="#0f172a" stroke="#1e40af"/>
      <text x="20" y="30" font-size="11" fill="#93c5fd" font-weight="600" letter-spacing="1.5">PROPRIETARY DATA</text>
      <text x="20" y="58" font-size="17" font-weight="700" fill="#f1f5f9">Expert corrections are gold</text>
      <text x="20" y="78" font-size="12" fill="#94a3b8">Compliance officers label rare edge cases GPT can't</text>
    </g>

    <!-- Metric tile 4 -->
    <g transform="translate(1240,94)">
      <rect width="440" height="90" rx="10" fill="#0f172a" stroke="#047857"/>
      <text x="20" y="30" font-size="11" fill="#6ee7b7" font-weight="600" letter-spacing="1.5">SWITCHING COST</text>
      <text x="20" y="58" font-size="17" font-weight="700" fill="#f1f5f9">Accuracy tuned to your org</text>
      <text x="20" y="78" font-size="12" fill="#94a3b8">Calibration + correction history doesn't transfer to competitors</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="900" y="1192" text-anchor="middle" font-size="11" fill="#475569">
    Shieldra AI · Learning Engine Architecture · Phases 1-3 shipped · shieldra.ai
  </text>
</svg>
