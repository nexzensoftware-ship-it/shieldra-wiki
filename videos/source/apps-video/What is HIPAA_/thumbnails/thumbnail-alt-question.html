<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail — What is HIPAA?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --brand-400: #60a5fa;
    --brand-500: #3b82f6;
    --accent-300: #67e8f9;
    --accent-400: #22d3ee;
    --violet-400: #a78bfa;
    --violet-500: #8b5cf6;
    --red-400:    #f87171;
    --red-500:    #ef4444;
    --surface-900:#0f172a;
    --surface-950:#020617;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1280px; height: 720px; }

  body {
    font-family: Inter, -apple-system, sans-serif;
    background: #000;
    color: white;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 1280px;
    height: 720px;
    background:
      radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.28), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(34, 211, 238, 0.20), transparent 55%),
      linear-gradient(135deg, #020617 0%, #0f172a 100%);
    overflow: hidden;
  }

  /* Subtle dot grid */
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Soft top highlight + bottom vignette */
  .stage::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  /* ── Content layout ─────────────────────────────────────── */
  .content {
    position: absolute;
    inset: 0;
    padding: 70px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top bar: brand + tag */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand-500), var(--accent-400));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(34, 211, 238, 0.35);
  }
  .brand-mark svg { width: 24px; height: 24px; }

  .tag {
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .tag-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red-500); box-shadow: 0 0 12px var(--red-500); }

  /* Headline block — hero content */
  .headline {
    margin-top: 30px;
  }

  .eyebrow {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-300);
    margin-bottom: 22px;
  }

  .title {
    font-size: 132px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.04em;
    margin-bottom: 26px;
  }

  .title .grad {
    background: linear-gradient(90deg, var(--brand-400) 0%, var(--accent-400) 50%, var(--violet-400) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 30px;
    font-weight: 600;
    color: rgba(226, 232, 240, 0.85);
    max-width: 880px;
    line-height: 1.3;
  }

  /* Bottom badges row */
  .bottom {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .badge {
    padding: 18px 28px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 4px;
  }
  .badge-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .badge-num.red    { color: var(--red-400); }
  .badge-num.cyan   { color: var(--accent-400); }
  .badge-num.violet { color: var(--violet-400); }
  .badge-label {
    font-size: 14px;
    font-weight: 600;
    color: rgba(148, 163, 184, 0.85);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Big shield motif on right side */
  .motif {
    position: absolute;
    right: -120px;
    top: 50%;
    transform: translateY(-50%);
    width: 720px;
    height: 720px;
    opacity: 0.10;
    pointer-events: none;
  }
  .motif svg { width: 100%; height: 100%; }

  /* Glow ring around the headline price */
  .glow-1 {
    position: absolute;
    width: 440px; height: 440px;
    background: radial-gradient(circle, rgba(239,68,68,0.25), transparent 70%);
    left: 40px; top: 280px;
    pointer-events: none;
    filter: blur(60px);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="motif">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L170 50 L170 110 C170 145 140 175 100 185 C60 175 30 145 30 110 L30 50 Z"
            stroke="white" stroke-width="3" fill="none"/>
      <path d="M100 35 L155 60 L155 110 C155 138 132 162 100 170 C68 162 45 138 45 110 L45 60 Z"
            stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M75 100 L92 117 L130 80" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="glow-1"></div>

  <div class="content">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2 L20 6 V12 C20 17 16 21 12 22 C8 21 4 17 4 12 V6 Z" fill="white"/>
          </svg>
        </div>
        <span>Shieldra</span>
      </div>
      <div class="tag"><span class="tag-dot"></span>HIPAA EXPLAINED</div>
    </div>

    <div class="headline">
      <div class="eyebrow">In 3 minutes</div>
      <div class="title">
        What is<br>
        <span class="grad">HIPAA?</span>
      </div>
      <div class="subtitle">
        Everything healthcare businesses need to know — without the lawyer-speak.
      </div>
    </div>

    <div class="bottom">
      <div class="badge">
        <div class="badge-num red">275M</div>
        <div class="badge-label">Records exposed in 2024</div>
      </div>
      <div class="badge">
        <div class="badge-num cyan">3×</div>
        <div class="badge-label">Breaches since 2018</div>
      </div>
      <div class="badge">
        <div class="badge-num violet">3:00</div>
        <div class="badge-label">Watch time</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
